<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6b93b" />
    <meta name="description" content="給 5–8 歲孩子的生活任務小遊戲" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>布麗的生活任務</title>
  </head>
  <body>
    <header class="topbar">
      <button id="home-button" class="icon-button hidden" aria-label="回到任務地圖">⌂</button>
      <div class="brand"><span>布麗的</span><strong>生活任務</strong></div>
      <button id="sound-button" class="icon-button" aria-label="關閉語音">🔊</button>
    </header>

    <main id="app" aria-live="polite"></main>

    <template id="home-template">
      <section class="home-screen">
        <div class="hero-card">
          <div>
            <p class="eyebrow">今天一起幫忙吧！</p>
            <h1>選一個生活任務</h1>
            <p>慢慢做、想一想，每完成一步都很棒。</p>
          </div>
          <img class="hero-character" src="assets/bluey.jpg" alt="布麗開心地舉起雙手" />
        </div>
        <div id="mission-grid" class="mission-grid"></div>
        <p class="parent-note">給大人：每關約 2–4 分鐘，沒有倒數與失敗懲罰。</p>
      </section>
    </template>

    <template id="game-template">
      <section class="game-screen">
        <div class="game-heading">
          <div>
            <p id="game-kicker" class="eyebrow"></p>
            <h1 id="game-title"></h1>
          </div>
          <div id="progress-dots" class="progress-dots" aria-label="任務進度"></div>
        </div>
        <div id="coach" class="coach-card">
          <img src="assets/bluey.jpg" alt="" />
          <div><strong id="coach-title"></strong><p id="coach-text"></p></div>
          <button id="repeat-button" class="speak-button" aria-label="再聽一次">🔈</button>
        </div>
        <div id="play-area" class="play-area"></div>
        <div id="feedback" class="feedback" role="status"></div>
      </section>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
